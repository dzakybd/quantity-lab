[project]
name = "quantity-lab"
version = "0.1.0"
description = "Floor-plan room quantities (area, perimeter, count): oracle, controlled errors and an OpenCV baseline"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Dzaky Zakiyal Fawwaz", email = "dzakybd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=5.0",
    "pillow>=12.0",
    "pymupdf>=1.28",
    "shapely>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "matplotlib>=3.11.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantity_lab"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
